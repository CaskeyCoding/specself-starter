[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specself"
version = "0.1.0"
description = "Thin, local command wrappers for the SpecSelf Starter kit"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
specself = "specself.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
